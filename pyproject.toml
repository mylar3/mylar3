[project]
name = "mylar3"
version = "0.8.3"
description = "Mylar3 is an automated Comic Book downloader (cbr/cbz) for use with NZB and torrents written in python. It supports SABnzbd, NZBGET, and many torrent clients in addition to DDL."
readme = "README.md"
requires-python = ">=3.8.1, <=3.11.4"
license = "GPL-3.0-or-later"
maintainers = [{ name = "evilhero" }]
keywords = [
  "comics",
  "comic-books",
  "digital-comics",
  "comic-manager",
  "media-manager",
  "organizer",
  "automation",
  "download",
  "tracking",
  "metadata",
  "usenet",
  "torrent",
  "web-interface",
  "self-hosted",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "apscheduler>=3.6.3",
  "beautifulsoup4>=4.8.2",
  "cfscrape>=2.0.8",
  "cheroot>=8.2.1",
  "cherrypy>=18.5.0",
  "configparser>=4.0.2",
  "feedparser>=5.2.1",
  "mako>=1.1.0",
  "natsort>=3.5.2",
  "packaging>=22.0",
  "pillow>=10.1",
  "pip>=25.0.1",
  "portend>=2.6",
  "pycryptodome>=3.19.0",
  "pystun>=0.1.0",
  "pytz>=2019.3",
  "rarfile>=4.0",
  "requests[socks]>=2.22.0",
  "simplejson>=3.17.0",
  "six>=1.13.0",
  "tenacity>=8.2.3",
  "tzlocal>=2.0.0",
  "urllib3<2",
  "user-agent2>=2021.12.11",
]

[project.urls]
homepage = "https://mylarcomics.com"
documentation = "https://mylarcomics.com/docs/introduction"
forum = "https://forum.mylarcomics.com"
discord = "https://discord.gg/6UG94R7E8T"
source = "https://github.com/mylar3/mylar3"
issues = "https://github.com/mylar3/mylar3/issues"
